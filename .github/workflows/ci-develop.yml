name: CI/CD Develop to Release

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set permissions for mvnw
        run: chmod +x ./mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and verify with Maven
        run: ./mvnw clean verify -Dspring.profiles.active=test

      - name: Run tests with Maven
        run: ./mvnw test -Dspring.profiles.active=test -Dspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

      - name: Merge develop into release
        if: success()
        uses: devops-infra/action-pull-request@v0.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: develop
          target_branch: release
          title: "Auto merge develop → release"