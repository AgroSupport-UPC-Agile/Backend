name: CD Test-Release

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Sync release branch
        run: |
          git fetch origin
          git checkout release
          git reset --hard origin/release

      - name: Deploy to staging (Render)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Create Pull Request to main from release
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release-to-main-${{ github.run_id }}
          title: "Release: release → main"
          body: |
            Pull request automático generado desde la rama `release`
            Validar el entorno de staging antes de aprobar el merge a producción.
          commit-message: "chore(ci): create PR from release to main"