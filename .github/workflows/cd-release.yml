name: CD Test-Release

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Sync release branch
        run: |
          git fetch origin
          git checkout release
          git reset --hard origin/release

      - name: Deploy to staging (Render)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Create Pull Request to main from release
        run: |
          git checkout -b release-to-main-${{ github.run_id }}
          git push origin release-to-main-${{ github.run_id }}

          gh pr create \
            --base main \
            --head release-to-main-${{ github.run_id }} \
            --title "Release: release → main" \
            --body "🚀 PR automático generado desde release para producción"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}