name: CD Test-Release

on:
  push:
    branches: [release]

jobs:
  deploy-and-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Create pull request to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release-to-main-${{ github.run_id }}
          title: "Release: ${{ github.ref_name }} → main"
          body: |
            PR automático desde la rama `${{ github.ref_name }}`
            Validar staging antes de hacer merge a producción.